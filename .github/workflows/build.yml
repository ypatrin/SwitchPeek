name: Build

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        shell: cmd
        run: build.cmd

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: SwitchPeekSetup
          path: bin/SwitchPeekSetup.exe

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches version in src/Shared.cs
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'.TrimStart('v')
          $m = Select-String -Path src/Shared.cs -Pattern 'AssemblyInformationalVersion\("([^"]+)"\)'
          $ver = $m.Matches[0].Groups[1].Value
          if ($ver -ne $tag) {
            Write-Error "Tag v$tag does not match version $ver in src/Shared.cs"
            exit 1
          }

      - uses: actions/download-artifact@v4
        with:
          name: SwitchPeekSetup
          path: bin

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ github.ref_name }}'
          gh release create $tag bin/SwitchPeekSetup.exe `
            --title "SwitchPeek $($tag.TrimStart('v'))" `
            --notes-file .github/release-notes.md `
            --generate-notes
